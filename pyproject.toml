[project]
name = "system-design-labs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shortener",
    "sdl-load",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["labs/lab-*/system/shortener", "toolkit/sdl-*"]

[tool.uv.sources]
shortener = { workspace = true }
sdl-load = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
"tools/charts.py" = ["E501"]  # long SVG strings

[tool.ruff.lint.isort]
known-first-party = [
    "shortener",
    "sdl_load",
    "the_codes",
    "the_cache",
    "break_it",
    "scenario",
    "check_solutions",
    "redirect_timer",
    "t3_shuffle",
    "t5_create_path",
    "t7_click_counter",
    "t8_db_breaker",
    "t9_half_open_cache",
]

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
cache_dir = ".cache/mypy"
mypy_path = "labs/lab-1-url-shortener/part-1-the-codes,labs/lab-1-url-shortener/part-2-the-cache,labs/lab-1-url-shortener/part-3-break-it,labs/lab-1-url-shortener/tools,labs/lab-1-url-shortener/your-turn"

[[tool.mypy.overrides]]
module = ["fakeredis.*", "asyncpg.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
cache_dir = ".cache/pytest"
# Each part of a lab is a folder with one script in it, not a package: put the folders on
# the path so a part's test can import its script.
pythonpath = [
    "labs/lab-1-url-shortener/system/shortener/tests",
    "labs/lab-1-url-shortener/part-1-the-codes",
    "labs/lab-1-url-shortener/part-2-the-cache",
    "labs/lab-1-url-shortener/part-3-break-it",
    "labs/lab-1-url-shortener/tools",
    "labs/lab-1-url-shortener/your-turn",
]
# your-turn/ holds the learner exercises: their tests fail until the learner finishes them, so
# a plain `pytest` skips the folder. Run it on purpose: pytest labs/lab-1-url-shortener/your-turn
norecursedirs = [".*", "*.egg", "build", "dist", "venv", "your-turn"]
markers = [
    "stack: needs the docker compose stack running (docker compose up -d)",
    "your_turn: a learner exercise (labs/*/your-turn); red until the learner solves it",
]
