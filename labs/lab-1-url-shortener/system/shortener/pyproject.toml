[project]
name = "shortener"
version = "0.1.0"
description = "Lab 1: a URL shortener built as a small system (API replicas, cache, queue, worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis>=5.2",
]

[project.optional-dependencies]
# The AWS-shaped option: DynamoDB for the links and SQS for the click events, run against
# LocalStack. Same code paths, different adapters (see wiring.py).
aws = ["boto3>=1.35"]

[project.scripts]
shortener-worker = "shortener.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortener"]
