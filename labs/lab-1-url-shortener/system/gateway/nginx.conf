# The front door. It does three jobs:
#   1. serves the little web page
#   2. spreads API calls and short-link clicks over the three API replicas
#   3. skips a replica that stops answering, and retries the call on another one

upstream api {
    # A shared-memory zone, so all nginx workers rotate through the replicas together.
    zone api 64k;
    # Look the replicas up again every few seconds. Without this nginx remembers the address
    # it found at startup, and a replica that is recreated (new container, new address) would
    # be unreachable for ever.
    resolver 127.0.0.11 valid=3s ipv6=off;
    # Passive health checks: after one failure a replica is skipped for 3 seconds.
    server api1:8000 resolve max_fails=1 fail_timeout=3s;
    server api2:8000 resolve max_fails=1 fail_timeout=3s;
    server api3:8000 resolve max_fails=1 fail_timeout=3s;
    keepalive 32;
}

server {
    listen 80;

    # The page itself.
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(app\.js|style\.css|favicon\.svg)$ {
        add_header Cache-Control "no-cache";
    }

    # The JSON API and everything that is not a short code.
    location /api/ {
        proxy_pass http://api;
        include /etc/nginx/proxy_common.conf;
    }

    # A short link: /Ab3dE9. The API answers with a 302.
    location ~ ^/[A-Za-z0-9_-]+$ {
        proxy_pass http://api;
        include /etc/nginx/proxy_common.conf;
    }
}
