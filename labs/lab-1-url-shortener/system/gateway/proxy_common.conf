proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# A replica that refuses the connection or times out: try the next one. (nginx never
# retries a POST that was already sent, so a link is not created twice.) A 503 from the app
# means "the database is down", which another replica cannot fix, so it is not retried.
proxy_connect_timeout 1s;
proxy_read_timeout 5s;
proxy_next_upstream error timeout http_502;
proxy_next_upstream_tries 3;
