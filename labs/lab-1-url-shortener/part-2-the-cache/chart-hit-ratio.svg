<line x1="64" x2="660" y1="268.0" y2="268.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="272.0" font-size="11" fill="#888780" text-anchor="end">0%</text>
<line x1="64" x2="660" y1="217.0" y2="217.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="221.0" font-size="11" fill="#888780" text-anchor="end">25%</text>
<line x1="64" x2="660" y1="166.0" y2="166.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="170.0" font-size="11" fill="#888780" text-anchor="end">50%</text>
<line x1="64" x2="660" y1="115.0" y2="115.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="119.0" font-size="11" fill="#888780" text-anchor="end">75%</text>
<line x1="64" x2="660" y1="64.0" y2="64.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="68.0" font-size="11" fill="#888780" text-anchor="end">100%</text>
<text x="76.0" y="286" font-size="11" fill="#888780" text-anchor="middle">2,000</text>
<text x="393.8" y="286" font-size="11" fill="#888780" text-anchor="middle">12k</text>
<text x="648.0" y="286" font-size="11" fill="#888780" text-anchor="middle">20k</text>
<text x="362.0" y="310" font-size="12" fill="#888780" text-anchor="middle">requests sent so far</text>
<polyline points="76.0,117.0 139.6,92.6 203.1,82.4 266.7,80.3 330.2,76.2 393.8,74.2 457.3,74.2 520.9,70.1 584.4,70.1 648.0,68.1" fill="none" stroke="#2f9e6e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
