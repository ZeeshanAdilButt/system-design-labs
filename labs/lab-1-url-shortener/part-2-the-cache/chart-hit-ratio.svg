<circle cx="393.8" cy="74.2" r="3.5" fill="#2f9e6e"><title>12k: 95%</title></circle>
<circle cx="457.3" cy="74.2" r="3.5" fill="#2f9e6e"><title>14k: 95%</title></circle>
